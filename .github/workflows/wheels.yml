name: wheels

# On every push to main, build binary wheels (with the compiled accelerators)
# and an sdist, then publish them to PyPI -- but only when the version in
# src/omi_physics/__init__.py is not already published. So a push that doesn't
# bump the version is a no-op, and bumping the version cuts a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: version check
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Skip if this version is already on PyPI
        run: |
          VERSION=$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' src/omi_physics/__init__.py)
          if [ -z "$VERSION" ]; then echo "could not read version"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/omi_physics/$VERSION/json")
          if [ "$CODE" = "200" ]; then
            echo "omi_physics $VERSION is already on PyPI -- skipping build and publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "omi_physics $VERSION is not on PyPI (HTTP $CODE) -- building and publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  wheels:
    name: wheels · ${{ matrix.os }}
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        # cibuildwheel config (build targets, skips, test-command) lives in
        # pyproject.toml under [tool.cibuildwheel].

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  sdist:
    name: sdist
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [check, wheels, sdist]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): configure a PyPI publisher for this repo +
    # workflow, and a GitHub environment named `pypi` (which can require a
    # manual approval before the release proceeds). No API token needed.
    environment:
      name: pypi
      url: https://pypi.org/p/omi_physics
    permissions:
      id-token: write
    steps:
      - name: Collect wheels + sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
