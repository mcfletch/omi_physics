[tox]
# CPython tests both paths (compiled accelerators + pure-Python fallback); PyPy
# tests the fallback only -- its JIT runs the pure-Python paths fast, while
# cpyext-bridged Cython would be slower and awkward to build.
envlist =
    py310-{accel,fallback}
    py311-{accel,fallback}
    py312-{accel,fallback}
    py313-{accel,fallback}
    py314-{accel,fallback}
    py315-{accel,fallback}
    pypy3-fallback
skip_missing_interpreters = true

[testenv]
# Build an sdist once and install it into each env, so every interpreter
# compiles its own accelerators (build isolation supplies Cython + NumPy).
package = sdist
extras = test
setenv =
    fallback: OMI_PHYSICS_NO_ACCEL = 1
commands_pre =
    accel: python -c "import omi_physics._solver_native, omi_physics._collide_native; print('accelerators: compiled')"
    fallback: python -c "from omi_physics import solver, narrowphase; assert solver._native is None and narrowphase._native is None; print('accelerators: pure-Python fallback')"
commands =
    pytest {posargs:-q}

# tox-gh maps a CI interpreter to the envs it should run (see .github/workflows).
[gh]
python =
    3.10 = py310-accel, py310-fallback
    3.11 = py311-accel, py311-fallback
    3.12 = py312-accel, py312-fallback
    3.13 = py313-accel, py313-fallback
    3.14 = py314-accel, py314-fallback
    3.15 = py315-accel, py315-fallback
    pypy-3.10 = pypy3-fallback
