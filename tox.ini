[tox]
# CPython tests both paths (compiled accelerators + pure-Python fallback); PyPy
# tests the fallback only -- its JIT runs the pure-Python paths fast, while
# cpyext-bridged Cython would be slower and awkward to build.
envlist =
    lint
    typecheck
    py310-{accel,fallback}
    py311-{accel,fallback}
    py312-{accel,fallback}
    py313-{accel,fallback}
    py314-{accel,fallback}
    py315-{accel,fallback}
    pypy3-fallback
skip_missing_interpreters = true

[testenv]
# Build an sdist once and install it into each env, so every interpreter
# compiles its own accelerators (build isolation supplies Cython + NumPy).
package = sdist
# gltest pulls PyOpenGL + glfw so the GPU-parity tests run where a GL 4.3
# context can be created, and skip cleanly where one cannot.
extras = test, gltest
# Pass the display / GPU vendor variables through tox's isolated environment so
# the GPU-parity tests can open a GL context where the host has one (they skip
# cleanly on a headless runner that has none).
passenv =
    CI
    DISPLAY
    WAYLAND_DISPLAY
    XDG_SESSION_TYPE
    XDG_RUNTIME_DIR
    XAUTHORITY
    __GLX_VENDOR_LIBRARY_NAME
    __NV_PRIME_RENDER_OFFLOAD
    LIBGL_*
    MESA_*
    NVIDIA_*
    PYOPENGL_PLATFORM
setenv =
    fallback: OMI_PHYSICS_NO_ACCEL = 1
commands_pre =
    accel: python -c "import omi_physics._solver_native, omi_physics._collide_native; print('accelerators: compiled')"
    fallback: python -c "from omi_physics import solver, narrowphase; assert solver._native is None and narrowphase._native is None; print('accelerators: pure-Python fallback')"
commands =
    pytest {posargs:-q}

# Lint and types are gates rather than good intentions: ruff and mypy were
# declared in the `dev` extra and run nowhere. Both read their whole
# configuration from pyproject.toml, so what runs here is what a bare `ruff
# check` or `mypy` in the checkout runs.
#
# `ruff format --check` is deliberately not among them. The array expressions
# here are laid out so the arithmetic keeps its shape -- a cross product is
# three rows because it is three rows -- and the formatter sets them as filled
# paragraphs of code. `ruff check` holds the line width (E501) instead.
[testenv:lint]
skip_install = true
deps = ruff
commands = ruff check

# mypy reads the sources rather than an installed copy, and needs only NumPy's
# stubs to do it -- so this env skips the build the other envs pay for.
[testenv:typecheck]
skip_install = true
deps =
    mypy
    numpy>=2.0
commands = mypy

# tox-gh maps a CI interpreter to the envs it should run (see .github/workflows).
[gh]
python =
    3.10 = py310-accel, py310-fallback
    3.11 = py311-accel, py311-fallback
    3.12 = lint, typecheck, py312-accel, py312-fallback
    3.13 = py313-accel, py313-fallback
    3.14 = py314-accel, py314-fallback
    3.15 = py315-accel, py315-fallback
    pypy-3.10 = pypy3-fallback
